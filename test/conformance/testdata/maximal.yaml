apiVersion: paperclip.inc/v1alpha1
kind: Instance
metadata:
  name: conf-maximal
spec:
  image:
    repository: ghcr.io/paperclipinc/paperclip
    tag: v1.0.0
  deployment:
    mode: authenticated
    exposure: private
  # Lightweight backends so the heavy feature surface below (RBAC, NetworkPolicy,
  # PDB, observability, multi-replica) is exercised for reconcile idempotency
  # without provisioning managed PostgreSQL/Redis StatefulSets on kind.
  database:
    mode: embedded
  redis:
    mode: external
    externalURL: redis://redis.example.com:6379
  storage:
    persistence:
      enabled: true
      size: 5Gi
  security:
    rbac:
      create: true
    networkPolicy:
      enabled: true
  availability:
    replicas: 2
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
  observability:
    metrics:
      enabled: true
      prometheusRule:
        enabled: true
      grafanaDashboard:
        enabled: true
