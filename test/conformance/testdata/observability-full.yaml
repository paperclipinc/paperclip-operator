apiVersion: paperclip.inc/v1alpha1
kind: Instance
metadata:
  name: conf-observability
spec:
  image:
    tag: v1.0.0
  database:
    mode: managed
  storage:
    persistence:
      enabled: true
      size: 1Gi
  observability:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      grafanaDashboard:
        enabled: true
